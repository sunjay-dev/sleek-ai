services:
  redis:
    image: redis:8.4-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: backend
    env_file:
      - ./apps/backend/.env
    depends_on:
      - redis
    ports:
      - "3000:3000"
    restart: always

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    container_name: worker
    env_file:
      - ./apps/worker/.env
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: frontend
    env_file:
      - ./apps/frontend/.env
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  redis_data:
